services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gestion_reservation_app
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - reservation_network

  nginx:
    image: nginx:alpine
    container_name: gestion_reservation_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - reservation_network

  mysql:
    image: mysql:8.0
    container_name: gestion_reservation_mysql
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reservation_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gestion_reservation_phpmyadmin
    env_file:
      - .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - reservation_network

volumes:
  mysql_data:

networks:
  reservation_network:
    driver: bridge
