name: Build and Push Docker Images

on:
  # Déclenché lorsqu'un nouveau tag v* est poussé
  push:
    tags:
      - "v*"

  # Permet de lancer manuellement le workflow
  workflow_dispatch:

env:
  IMAGE_NAME: gestion-reservation-salles

jobs:

  # ==========================================================
  # 1. RÉCUPÉRER TOUS LES TAGS GITHUB
  # ==========================================================
  get-tags:
    name: Get Git Tags
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      latest_tag: ${{ steps.tags.outputs.latest_tag }}

    steps:

      # --------------------------------------------------------
      # Récupérer tout le dépôt + tous les tags
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # --------------------------------------------------------
      # Récupérer les tags v*
      # --------------------------------------------------------
      - name: Get tags
        id: tags
        shell: bash
        run: |

          echo "======================================"
          echo " TAGS GITHUB"
          echo "======================================"

          TAGS=$(git tag --list 'v*' --sort=-v:refname)

          if [ -z "$TAGS" ]; then
            echo "Aucun tag v* trouvé."
            exit 1
          fi

          echo "$TAGS"

          echo ""
          echo "Nombre de tags :"
          echo "$TAGS" | wc -l

          # Transformer les tags en JSON
          TAGS_JSON=$(printf '%s\n' "$TAGS" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # Le premier est le plus récent
          LATEST_TAG=$(printf '%s\n' "$TAGS" | head -n 1)

          echo ""
          echo "Latest tag : $LATEST_TAG"

          echo "tags=$TAGS_JSON" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # 2. BUILD + PUSH DE CHAQUE TAG
  # ==========================================================
  docker:
    name: Build ${{ matrix.tag }}

    needs: get-tags

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        tag: ${{ fromJSON(needs.get-tags.outputs.tags) }}

    permissions:
      contents: read

    steps:

      # ======================================================
      # RÉCUPÉRER LE DÉPÔT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true


      # ======================================================
      # SAUVEGARDER LES FICHIERS DOCKER ACTUELS
      # ======================================================
      #
      # Ils existent dans la branche actuelle mais pas
      # forcément dans les anciens tags.
      #
      # ======================================================
      - name: Save current Docker files
        shell: bash
        run: |

          echo "Sauvegarde des fichiers Docker actuels..."

          mkdir -p /tmp/docker-files

          cp -R docker /tmp/docker-files/docker

          echo "Dockerfile et configuration Docker sauvegardés."


      # ======================================================
      # SE PLACER SUR LE TAG HISTORIQUE
      # ======================================================
      - name: Checkout Git tag
        shell: bash
        run: |

          echo "======================================"
          echo " VERSION"
          echo "======================================"

          git checkout "${{ matrix.tag }}"

          echo "Tag utilisé :"
          git describe --tags --exact-match

          echo ""
          echo "Commit :"
          git rev-parse HEAD


      # ======================================================
      # RESTAURER LES FICHIERS DOCKER ACTUELS
      # ======================================================
      #
      # Cela permet de construire les anciennes versions
      # même si elles ne possédaient pas encore docker/.
      #
      # ======================================================
      - name: Restore Docker files
        shell: bash
        run: |

          echo "Restauration des fichiers Docker..."

          rm -rf docker

          cp -R /tmp/docker-files/docker docker

          echo ""
          echo "Structure Docker :"

          find docker -maxdepth 3 -type f | sort


      # ======================================================
      # VÉRIFIER LES FICHIERS NÉCESSAIRES
      # ======================================================
      - name: Check project files
        shell: bash
        run: |

          echo "======================================"
          echo " VÉRIFICATION"
          echo "======================================"

          echo ""
          echo "Commit courant :"
          git rev-parse HEAD

          echo ""
          echo "Dockerfile :"

          test -f docker/php/Dockerfile \
            && echo "OK : docker/php/Dockerfile" \
            || {
              echo "ERREUR : Dockerfile absent"
              exit 1
            }

          echo ""
          echo "composer.json :"

          test -f composer.json \
            && echo "OK : composer.json" \
            || {
              echo "ERREUR : composer.json absent"
              exit 1
            }

          echo ""
          echo "composer.lock :"

          if [ -f composer.lock ]; then
            echo "OK : composer.lock"
          else
            echo "ATTENTION : composer.lock absent"
          fi


      # ======================================================
      # DOCKER BUILDX
      # ======================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ======================================================
      # LOGIN DOCKER HUB
      # ======================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ======================================================
      # MÉTADONNÉES DOCKER
      # ======================================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:

          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=latest,enable=${{ matrix.tag == needs.get-tags.outputs.latest_tag }}


      # ======================================================
      # BUILD + PUSH
      # ======================================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:

          context: .

          file: ./docker/php/Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max